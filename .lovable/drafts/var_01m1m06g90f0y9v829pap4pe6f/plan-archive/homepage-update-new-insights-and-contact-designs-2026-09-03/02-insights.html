<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .fill { fill: hsl(var(--muted)); stroke: none; }
    .rail { stroke: hsl(var(--border)); stroke-width: 1; }
    .bar { fill: hsl(var(--border)); }
  </style>

  <text class="note" x="0" y="12">Insights — new two-column layout</text>

  <!-- featured -->
  <rect class="bx" x="0" y="24" width="300" height="280" rx="8"/>
  <rect class="fill" x="12" y="36" width="276" height="150" rx="8"/>
  <rect class="bar" x="12" y="200" width="120" height="7" rx="3"/>
  <rect class="bar" x="12" y="218" width="250" height="10" rx="4"/>
  <rect class="bar" x="12" y="234" width="200" height="10" rx="4"/>
  <rect class="bar" x="12" y="256" width="240" height="6" rx="3"/>
  <rect class="bar" x="12" y="268" width="180" height="6" rx="3"/>
  <text class="lbl" x="12" y="294">READ ARTICLE</text>

  <!-- three rows -->
  <g>
    <rect class="fill" x="580" y="36" width="52" height="52" rx="8"/>
    <rect class="bar" x="330" y="38" width="110" height="7" rx="3"/>
    <rect class="bar" x="330" y="54" width="220" height="9" rx="4"/>
    <rect class="bar" x="330" y="70" width="160" height="9" rx="4"/>
    <text class="note" x="330" y="100">READ ARTICLE</text>
    <line class="rail" x1="330" y1="112" x2="632" y2="112"/>
  </g>
  <g>
    <rect class="fill" x="580" y="126" width="52" height="52" rx="8"/>
    <rect class="bar" x="330" y="128" width="90" height="7" rx="3"/>
    <rect class="bar" x="330" y="144" width="220" height="9" rx="4"/>
    <rect class="bar" x="330" y="160" width="190" height="9" rx="4"/>
    <text class="note" x="330" y="190">READ ARTICLE</text>
    <line class="rail" x1="330" y1="202" x2="632" y2="202"/>
  </g>
  <g>
    <rect class="fill" x="580" y="216" width="52" height="52" rx="8"/>
    <rect class="bar" x="330" y="218" width="100" height="7" rx="3"/>
    <rect class="bar" x="330" y="234" width="220" height="9" rx="4"/>
    <rect class="bar" x="330" y="250" width="170" height="9" rx="4"/>
    <text class="note" x="330" y="280">READ ARTICLE</text>
  </g>

  <!-- view more -->
  <rect x="255" y="312" width="100" height="16" rx="8" fill="hsl(var(--accent))" stroke="none"/>
  <text x="305" y="324" text-anchor="middle" style="font-size:10px; fill: hsl(var(--accent-foreground))">View More</text>
</svg>
