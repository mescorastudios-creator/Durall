<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .l { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480 }
    .n { fill: hsl(var(--muted-foreground)); font-size: 12px }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1 }
    .rail { stroke: hsl(var(--border)); stroke-width: 1 }
    .q { fill: hsl(var(--muted)) }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1 }
  </style>

  <text x="20" y="20" class="n">now — list grows past the pinned frame</text>
  <rect x="20" y="32" width="260" height="180" rx="8" class="bx"/>
  <rect x="40" y="48" width="150" height="10" rx="5" class="q"/>
  <rect x="40" y="70" width="200" height="10" rx="5" class="q"/>
  <rect x="40" y="92" width="200" height="10" rx="5" class="q"/>
  <rect x="40" y="114" width="200" height="10" rx="5" class="q"/>
  <rect x="40" y="136" width="200" height="10" rx="5" class="q"/>
  <rect x="40" y="158" width="200" height="10" rx="5" class="q"/>
  <rect x="40" y="180" width="200" height="10" rx="5" class="q"/>
  <rect x="40" y="202" width="200" height="10" rx="5" class="q" opacity="0.5"/>
  <rect x="40" y="224" width="200" height="10" rx="5" class="q" opacity="0.35"/>
  <line x1="20" y1="212" x2="280" y2="212" class="rail" stroke-dasharray="4 3"/>
  <text x="20" y="252" class="n">steps 04 – 05 clipped below the frame edge</text>

  <text x="360" y="20" class="n">after — reserved and compressed to fit</text>
  <rect x="360" y="32" width="260" height="180" rx="8" class="acc"/>
  <rect x="380" y="46" width="150" height="9" rx="4.5" class="q"/>
  <rect x="380" y="65" width="200" height="9" rx="4.5" class="q"/>
  <rect x="380" y="84" width="200" height="9" rx="4.5" class="q"/>
  <rect x="380" y="103" width="200" height="9" rx="4.5" class="q"/>
  <rect x="380" y="122" width="200" height="9" rx="4.5" class="q"/>
  <rect x="380" y="141" width="200" height="9" rx="4.5" class="q"/>
  <rect x="380" y="160" width="200" height="9" rx="4.5" class="q"/>
  <rect x="380" y="179" width="200" height="9" rx="4.5" class="q"/>
  <rect x="380" y="194" width="200" height="9" rx="4.5" class="q"/>
  <text x="360" y="252" class="n">all five stages land inside the frozen viewport</text>
</svg>
