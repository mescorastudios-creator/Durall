<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .sm { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .greek { fill: hsl(var(--border)); }
  </style>

  <!-- desktop frame -->
  <text class="sm" x="8" y="14">desktop &gt;=1280px</text>
  <rect class="bx" x="8" y="22" width="380" height="240" rx="8"/>

  <!-- left copy half -->
  <text class="sm" x="28" y="52">04 — how we work</text>
  <rect class="greek" x="28" y="62" width="150" height="10" rx="5"/>
  <rect class="greek" x="28" y="78" width="118" height="10" rx="5"/>
  <rect class="greek" x="28" y="102" width="140" height="6" rx="3"/>
  <line x1="30" y1="122" x2="30" y2="222" stroke="hsl(var(--border))" stroke-width="1"/>
  <circle cx="30" cy="132" r="4" fill="hsl(var(--accent-foreground))"/>
  <rect class="greek" x="42" y="127" width="86" height="8" rx="4"/>
  <rect class="greek" x="42" y="151" width="70" height="8" rx="4"/>
  <rect class="greek" x="42" y="175" width="78" height="8" rx="4"/>
  <rect class="greek" x="42" y="199" width="66" height="8" rx="4"/>
  <text class="sm" x="28" y="238">steps 01–05 + travelling marker</text>

  <!-- right image half, full bleed -->
  <rect x="198" y="22" width="190" height="240" rx="0" fill="hsl(var(--accent))"/>
  <text class="lbl" x="216" y="132" fill="hsl(var(--accent-foreground))">stage photo</text>
  <text class="sm" x="216" y="150" fill="hsl(var(--accent-foreground))">100svh · object-cover</text>
  <rect class="bx" x="212" y="200" width="120" height="44" rx="8" stroke="hsl(var(--accent-foreground))"/>
  <text class="sm" x="222" y="222" fill="hsl(var(--accent-foreground))">current stage</text>

  <!-- mobile frame -->
  <text class="sm" x="440" y="14">mobile / tablet</text>
  <rect class="bx" x="440" y="22" width="120" height="240" rx="8"/>
  <rect class="greek" x="456" y="40" width="80" height="9" rx="4"/>
  <rect class="greek" x="456" y="56" width="62" height="9" rx="4"/>
  <line x1="458" y1="76" x2="458" y2="150" stroke="hsl(var(--border))"/>
  <rect class="greek" x="468" y="80" width="60" height="7" rx="3"/>
  <rect class="greek" x="468" y="100" width="52" height="7" rx="3"/>
  <rect class="greek" x="468" y="120" width="56" height="7" rx="3"/>
  <rect x="456" y="164" width="88" height="82" rx="4" fill="hsl(var(--muted))"/>
  <text class="sm" x="466" y="210">stacked photo</text>
</svg>
