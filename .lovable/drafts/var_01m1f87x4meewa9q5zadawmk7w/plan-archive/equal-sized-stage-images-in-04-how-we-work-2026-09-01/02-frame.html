<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="100%" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .hd { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .q { fill: hsl(var(--muted)); }
    .z { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
  </style>

  <text class="hd" x="0" y="14">now — same frame, different fill</text>
  <g transform="translate(0,26)">
    <rect class="q" x="0" y="0" width="80" height="110"/><rect class="bx" x="0" y="0" width="80" height="110"/>
    <rect class="z" x="8" y="-6" width="64" height="122"/>
    <text class="lbl" x="0" y="128">portrait src</text>

    <rect class="q" x="110" y="0" width="80" height="110"/><rect class="bx" x="110" y="0" width="80" height="110"/>
    <rect class="z" x="96" y="6" width="108" height="98"/>
    <text class="lbl" x="110" y="128">wide src — heavy crop</text>

    <rect class="q" x="300" y="0" width="74" height="102"/><rect class="bx" x="300" y="0" width="74" height="102"/>
    <text class="lbl" x="300" y="120">Design renders smaller</text>
    <circle cx="386" cy="14" r="9" fill="hsl(var(--accent))"/>
    <text x="386" y="18" text-anchor="middle" style="font-size:11px; fill: hsl(var(--accent-foreground))">1</text>
  </g>

  <text class="hd" x="0" y="192">after — one frame, one crop rule, one zoom</text>
  <g transform="translate(0,204)">
    <rect class="q" x="0" y="0" width="80" height="80"/><rect class="bx" x="0" y="0" width="80" height="80"/>
    <rect class="q" x="96" y="0" width="80" height="80"/><rect class="bx" x="96" y="0" width="80" height="80"/>
    <rect class="q" x="192" y="0" width="80" height="80"/><rect class="bx" x="192" y="0" width="80" height="80"/>
    <rect class="q" x="288" y="0" width="80" height="80"/><rect class="bx" x="288" y="0" width="80" height="80"/>
    <rect class="q" x="384" y="0" width="80" height="80"/><rect class="bx" x="384" y="0" width="80" height="80"/>
    <text class="lbl" x="0" y="94">all five identical box, identical scale, centered crop</text>
  </g>
</svg>
