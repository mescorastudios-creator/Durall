<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why the freeze jumps today and how the fix removes the offset">
<style>
text { font-family: var(--font-sans); fill: hsl(var(--muted-foreground)); font-size: 12px; }
.lbl { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }
.box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
.rail { stroke: hsl(var(--border)); stroke-width: 1; }
.zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
.wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
.acc { fill: hsl(var(--accent)); }
.accst { stroke: hsl(var(--accent)); stroke-width: 1; fill: none; }
.accink { fill: hsl(var(--accent-foreground)); font-size: 11px; }
.quiet { fill: hsl(var(--muted)); }
</style>
<defs>
<marker id="ch2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
<path d="M0 0 L6 3.5 L0 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
</marker>
</defs>

<text class="lbl" x="24" y="26">today — jump</text>
<rect class="zone" x="24" y="40" width="120" height="150"/>
<text x="30" y="204">viewport</text>
<rect class="box" x="40" y="16" width="88" height="210" rx="8"/>
<text x="48" y="120" style="font-size:11px">section taller</text>
<text x="48" y="136" style="font-size:11px">than screen</text>
<path class="wire" d="M160 100 H196" marker-end="url(#ch2)"/>
<rect class="zone" x="212" y="40" width="120" height="150"/>
<rect class="box" x="228" y="34" width="88" height="210" rx="8"/>
<path class="accst" d="M228 16 L228 34" stroke-dasharray="3 3"/>
<circle class="acc" cx="228" cy="26" r="9"/>
<text class="accink" x="224.5" y="30">1</text>
<text x="244" y="24">lock shifts it</text>

<line class="rail" x1="360" y1="16" x2="360" y2="250"/>

<text class="lbl" x="384" y="26">fixed — invisible lock</text>
<rect class="zone" x="384" y="40" width="120" height="150"/>
<rect class="quiet" x="384" y="40" width="120" height="150" rx="8"/>
<text x="392" y="108" style="font-size:11px">frame = exactly</text>
<text x="392" y="124" style="font-size:11px">one viewport</text>
<text x="390" y="204">viewport</text>
<path class="wire" d="M520 100 H556" marker-end="url(#ch2)"/>
<rect class="zone" x="520" y="40" width="0" height="0"/>
<rect class="quiet" x="556" y="40" width="60" height="150" rx="8"/>
<rect class="zone" x="556" y="40" width="60" height="150"/>
<text x="560" y="204">frozen</text>

<circle class="acc" cx="34" cy="264" r="9"/>
<text class="accink" x="30.5" y="268">1</text>
<text x="52" y="268">nothing moves at the lock, so the freeze is not felt</text>

<circle class="acc" cx="34" cy="292" r="9"/>
<text class="accink" x="30.5" y="296">2</text>
<text x="52" y="296">first stage holds a beat, then steps drift open one by one</text>
</svg>
