<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" style="font-family:var(--font-sans)">
  <style>
    text{font-family:var(--font-sans)}
    .b{font-size:14px;font-weight:480;fill:hsl(var(--foreground))}
    .l{font-size:12px;fill:hsl(var(--muted-foreground))}
  </style>

  <text class="b" x="0" y="16">now, short / zoomed window</text>
  <rect x="0" y="28" width="140" height="150" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text class="l" x="14" y="60">text</text>
  <rect x="140" y="28" width="140" height="150" rx="8" fill="hsl(var(--muted))" stroke="hsl(var(--muted-foreground))"/>
  <text class="l" x="154" y="60">photo</text>
  <rect x="0" y="28" width="280" height="104" rx="8" fill="none" stroke="hsl(var(--border))" stroke-dasharray="4 3"/>
  <text class="l" x="288" y="86">screen ends here —</text>
  <text class="l" x="288" y="104">photo runs past it</text>

  <text class="b" x="0" y="216">proposed</text>
  <rect x="0" y="228" width="140" height="60" rx="8" fill="none" stroke="hsl(var(--muted-foreground))"/>
  <text class="l" x="14" y="262">text, fitted</text>
  <rect x="140" y="228" width="140" height="60" rx="8" fill="hsl(var(--accent))" stroke="hsl(var(--accent-foreground))"/>
  <text class="l" x="154" y="262" style="fill:hsl(var(--accent-foreground))">photo 50% x 1 screen</text>
  <rect x="0" y="228" width="280" height="60" rx="8" fill="none" stroke="hsl(var(--border))" stroke-dasharray="4 3"/>
  <text class="l" x="288" y="262">section = exactly one screen</text>
</svg>
